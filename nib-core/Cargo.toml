[package]
name = "nib-core"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "*"
thiserror = "*"
log = "*"
unicode_categories = "0.1.1"
random = "0.14.0"
libffi = "4.1.1"
minidl = "0.1.6"
simple_logger = "5.0.0"
region = "3.0.2"
symbol_table = { version = "0.5.0", default-features = false, features = ["global"] }

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
